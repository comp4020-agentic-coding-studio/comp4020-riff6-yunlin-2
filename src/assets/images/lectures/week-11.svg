<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="A large speech bubble that holds no words at all except a trailing ellipsis, so the argument persuades by what it declines to say rather than by anything printed inside it.">
  <title>The unsaid argument</title>
  <rect width="800" height="450" fill="#efece7"/>
  <rect x="16" y="16" width="768" height="418" fill="none" stroke="#c9c3b6" stroke-width="2"/>
  <!-- The force of the argument depends on what it refuses to say; the bubble stays empty. -->
  <path d="M220 100 H580 a30 30 0 0 1 30 30 V250 a30 30 0 0 1 -30 30 H360 l-60 60 v-60 H220 a30 30 0 0 1 -30 -30 V130 a30 30 0 0 1 30 -30 Z" fill="#f6f4ef" stroke="#23201b" stroke-width="2.5"/>
  <circle cx="360" cy="192" r="9" fill="#23201b"/>
  <circle cx="400" cy="192" r="9" fill="#23201b"/>
  <circle cx="440" cy="192" r="9" fill="#9a3b2e"/>
  <text x="400" y="415" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#7a7364" font-style="italic">it persuades by what it never mentions</text>
</svg>
