<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="The word LESS set in large letters with a minus sign, two of its letters shown faded and being taken away, so subtraction reads as an action performed rather than a blankness that was always there.">
  <title>Less is a verb</title>
  <rect width="800" height="450" fill="#efece7"/>
  <rect x="16" y="16" width="768" height="418" fill="none" stroke="#c9c3b6" stroke-width="2"/>
  <!-- The letters are removed on purpose; the object keeps the shape of what was taken out. -->
  <text x="330" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="bold" fill="#23201b" letter-spacing="6">LE</text>
  <text x="470" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="bold" fill="#c9c3b6" letter-spacing="6">SS</text>
  <line x1="452" y1="150" x2="512" y2="150" stroke="#9a3b2e" stroke-width="10" stroke-linecap="round"/>
  <line x1="552" y1="150" x2="612" y2="150" stroke="#9a3b2e" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
  <rect x="240" y="300" width="70" height="8" fill="#9a3b2e"/>
  <text x="400" y="415" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#7a7364" font-style="italic">a removal you can feel, not an absence you cannot</text>
</svg>
