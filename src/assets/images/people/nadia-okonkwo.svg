<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="An ink portrait plate: a frontal head read as the blank space carved from a mass of ink, crossed by a single waterline below which the submerged mass shows.">
  <title>The auditor's portrait: a face of negative space, crossed by the waterline she once hid the losses beneath.</title>
  <rect width="600" height="600" fill="#efece7"/>
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="#c9c3b6" stroke-width="2"/>
  <!-- The face is the blank oval carved out of the ink field: the head read as negative space. -->
  <path d="M150 92 H450 V430 H150 Z M300 122 C362 122 404 190 404 266 C404 346 360 404 300 404 C240 404 196 346 196 266 C196 190 238 122 300 122 Z" fill="#23201b" fill-rule="evenodd"/>
  <path d="M158 512 C158 452 226 420 300 420 C374 420 442 452 442 512 Z" fill="#23201b"/>
  <!-- The distinguishing motif: a waterline, and the submerged mass that sits below it. -->
  <path d="M226 300 h148" fill="none" stroke="#9a3b2e" stroke-width="4"/>
  <path d="M262 300 L300 372 L338 300 Z" fill="#9a3b2e" fill-opacity="0.35"/>
  <text x="300" y="560" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#7a7364" font-style="italic">below the line</text>
</svg>
