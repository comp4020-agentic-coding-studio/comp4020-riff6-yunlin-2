<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="An ink portrait plate: a frontal head read as the blank space carved from a mass of ink, with a single ellipsis of three dots set where a mouth would be.">
  <title>The con man's portrait: a face made of negative space, marked by the ellipsis of what went unsaid.</title>
  <rect width="600" height="600" fill="#efece7"/>
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="#c9c3b6" stroke-width="2"/>
  <!-- The face is the blank oval carved out of the ink field: the head read as negative space. -->
  <path d="M150 92 H450 V430 H150 Z M300 122 C362 122 404 190 404 266 C404 346 360 404 300 404 C240 404 196 346 196 266 C196 190 238 122 300 122 Z" fill="#23201b" fill-rule="evenodd"/>
  <path d="M158 512 C158 452 226 420 300 420 C374 420 442 452 442 512 Z" fill="#23201b"/>
  <!-- The distinguishing motif: an ellipsis, the argument left unsaid. -->
  <circle cx="264" cy="300" r="9" fill="#9a3b2e"/>
  <circle cx="300" cy="300" r="9" fill="#9a3b2e"/>
  <circle cx="336" cy="300" r="9" fill="#9a3b2e"/>
  <text x="300" y="560" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#7a7364" font-style="italic">the unsaid argument</text>
</svg>
