<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="An ink portrait plate: a profile facing left, its face rendered as the blank gap between two blocks of ink rather than by any drawn line.">
  <title>An apophatic portrait: the face read as the gap between two ink masses.</title>
  <rect width="600" height="600" fill="#efece7"/>
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="#c9c3b6" stroke-width="2"/>
  <!-- The face is the negative space between two ink masses: apophatic portraiture. -->
  <path d="M120 80 H480 V520 H120 Z M300 150 c60 0 92 46 92 108 0 30 -8 46 -22 60 24 8 44 26 44 58 0 26 -18 40 -44 46 l0 10 -140 0 0 -252 c0 -60 34 -94 70 -84 Z" fill="#23201b" fill-rule="evenodd"/>
  <path d="M300 150 c-24 4 -40 34 -40 84 v252 h-60 V80 h100 c0 24 0 46 0 70 Z" fill="#23201b"/>
  <circle cx="336" cy="232" r="7" fill="#efece7"/>
  <text x="300" y="560" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#7a7364" font-style="italic">via negativa</text>
</svg>
