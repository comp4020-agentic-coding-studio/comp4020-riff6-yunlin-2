<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="An ink portrait plate: a frontal head read as the blank space carved from a mass of ink, holding a single small blank scroll left deliberately unwritten.">
  <title>The plagiarist's portrait: a face of negative space, holding one blank scroll left honestly empty.</title>
  <rect width="600" height="600" fill="#efece7"/>
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="#c9c3b6" stroke-width="2"/>
  <!-- The face is the blank oval carved out of the ink field: the head read as negative space. -->
  <path d="M150 92 H450 V430 H150 Z M300 122 C362 122 404 190 404 266 C404 346 360 404 300 404 C240 404 196 346 196 266 C196 190 238 122 300 122 Z" fill="#23201b" fill-rule="evenodd"/>
  <path d="M158 512 C158 452 226 420 300 420 C374 420 442 452 442 512 Z" fill="#23201b"/>
  <!-- The distinguishing motif: a blank scroll, the earned emptiness left unwritten. -->
  <g fill="none" stroke="#9a3b2e" stroke-width="3">
    <rect x="272" y="240" width="56" height="52"/>
    <path d="M272 252 h56"/>
    <path d="M272 280 h56"/>
  </g>
  <text x="300" y="560" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#7a7364" font-style="italic">the blank was theirs</text>
</svg>
