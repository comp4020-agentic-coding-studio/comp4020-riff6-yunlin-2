<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="A filing cabinet with its lower drawer pulled fully open and completely empty, the findings that were never published standing for the file-drawer problem; the drawers above stay shut.">
  <title>An open, empty file drawer</title>
  <rect width="800" height="450" fill="#efece7"/>
  <rect x="16" y="16" width="768" height="418" fill="none" stroke="#c9c3b6" stroke-width="2"/>
  <!-- Cabinet body. -->
  <rect x="250" y="70" width="300" height="300" fill="none" stroke="#23201b" stroke-width="3"/>
  <!-- Two closed drawers up top. -->
  <rect x="250" y="70" width="300" height="80" fill="none" stroke="#23201b" stroke-width="2"/>
  <rect x="250" y="150" width="300" height="80" fill="none" stroke="#23201b" stroke-width="2"/>
  <line x1="370" y1="110" x2="430" y2="110" stroke="#23201b" stroke-width="6" stroke-linecap="round"/>
  <line x1="370" y1="190" x2="430" y2="190" stroke="#23201b" stroke-width="6" stroke-linecap="round"/>
  <!-- The bottom drawer, pulled open and empty. -->
  <path d="M230 250 L570 250 L610 360 L190 360 Z" fill="#efece7" stroke="#23201b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M250 270 L550 270 L580 340 L220 340 Z" fill="none" stroke="#c9c3b6" stroke-width="2" stroke-linejoin="round"/>
  <!-- The empty pull handle, in accent: nothing filed here. -->
  <line x1="360" y1="305" x2="440" y2="305" stroke="#9a3b2e" stroke-width="6" stroke-linecap="round"/>
  <text x="400" y="415" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#7a7364" font-style="italic">the results no one thought worth keeping</text>
</svg>
