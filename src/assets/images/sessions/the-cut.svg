<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="A strip of film runs across the plate with sprocket holes along both edges; at its centre two frames meet at a jagged seam where the cut falls, one frame left empty to mark what the edit removed.">
  <title>Two film frames meeting at a cut</title>
  <rect width="800" height="450" fill="#efece7"/>
  <rect x="16" y="16" width="768" height="418" fill="none" stroke="#c9c3b6" stroke-width="2"/>
  <!-- The filmstrip body. -->
  <rect x="90" y="150" width="620" height="150" fill="none" stroke="#23201b" stroke-width="3"/>
  <!-- Sprocket holes top and bottom. -->
  <g fill="#23201b">
    <rect x="110" y="160" width="20" height="14"/><rect x="170" y="160" width="20" height="14"/><rect x="230" y="160" width="20" height="14"/><rect x="290" y="160" width="20" height="14"/><rect x="490" y="160" width="20" height="14"/><rect x="550" y="160" width="20" height="14"/><rect x="610" y="160" width="20" height="14"/><rect x="670" y="160" width="20" height="14"/>
    <rect x="110" y="276" width="20" height="14"/><rect x="170" y="276" width="20" height="14"/><rect x="230" y="276" width="20" height="14"/><rect x="290" y="276" width="20" height="14"/><rect x="490" y="276" width="20" height="14"/><rect x="550" y="276" width="20" height="14"/><rect x="610" y="276" width="20" height="14"/><rect x="670" y="276" width="20" height="14"/>
  </g>
  <!-- Left frame: a simple figure. -->
  <rect x="130" y="188" width="230" height="74" fill="none" stroke="#23201b" stroke-width="2"/>
  <circle cx="245" cy="225" r="20" fill="#23201b"/>
  <!-- Right frame: left blank, the shot the cut removed. -->
  <rect x="440" y="188" width="230" height="74" fill="none" stroke="#23201b" stroke-width="2"/>
  <!-- The seam of the cut, in accent. -->
  <path d="M400 140 L392 175 L408 205 L390 235 L406 265 L398 310" fill="none" stroke="#9a3b2e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="415" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#7a7364" font-style="italic">one scene, two ways of joining what remains</text>
</svg>
